<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .title { font: 700 48px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .sub { font: 400 25px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #566176; }
      .step { font: 700 30px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .body { font: 500 23px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #344054; }
      .small { font: 500 19px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #566176; }
      .label { font: 700 22px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .card { fill: #ffffff; stroke: #d8deea; stroke-width: 2; }
      .tile { stroke: #172033; stroke-width: 4; rx: 8; }
      .arrow { fill: none; stroke: #5965e8; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#5965e8"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#f4f6fa"/>
  <text x="80" y="82" class="title">白色底层十字：单条棱块直插法</text>
  <text x="80" y="126" class="sub">全程白色中心朝下、黄色中心朝上；“侧色对中心”比“先凑白十字”更重要。</text>

  <!-- Step 1 -->
  <rect x="60" y="170" width="465" height="345" rx="24" class="card"/>
  <circle cx="105" cy="217" r="24" fill="#5965e8"/>
  <text x="97" y="225" font-family="sans-serif" font-size="23" font-weight="700" fill="white">1</text>
  <text x="145" y="227" class="step">在顶层找到白色棱</text>
  <text x="95" y="270" class="body">白色贴纸朝上；另一面是红色。</text>

  <!-- white sticker top, red side sticker -->
  <polygon points="230,317 310,282 390,317 310,352" fill="#fff" stroke="#172033" stroke-width="4"/>
  <polygon points="230,317 310,352 310,425 230,389" fill="#d92d20" stroke="#172033" stroke-width="4"/>
  <polygon points="310,352 390,317 390,389 310,425" fill="#f97066" stroke="#172033" stroke-width="4"/>
  <text x="280" y="326" class="label">白</text>
  <text x="260" y="385" class="label" fill="#fff">红</text>
  <text x="95" y="480" class="small">提示：先只看一条，不必一次规划四条。</text>

  <!-- Step 2 -->
  <rect x="565" y="170" width="465" height="345" rx="24" class="card"/>
  <circle cx="610" cy="217" r="24" fill="#5965e8"/>
  <text x="602" y="225" font-family="sans-serif" font-size="23" font-weight="700" fill="white">2</text>
  <text x="650" y="227" class="step">转 U，对准侧面中心</text>
  <text x="600" y="270" class="body">转顶层，直到“红色在红中心正上方”。</text>

  <!-- side ring before/after -->
  <text x="604" y="328" class="small">之前</text>
  <rect x="676" y="300" width="58" height="58" fill="#d92d20" class="tile"/>
  <text x="692" y="337" class="label" fill="#fff">红</text>
  <rect x="676" y="370" width="58" height="58" fill="#1570ef" class="tile"/>
  <text x="692" y="407" class="label" fill="#fff">蓝</text>
  <path d="M754 337 C790 300, 826 300, 858 337" class="arrow" marker-end="url(#arrowhead)"/>
  <text x="792" y="295" class="label" fill="#5965e8">U</text>
  <text x="875" y="328" class="small">之后</text>
  <rect x="940" y="300" width="58" height="58" fill="#d92d20" class="tile"/>
  <text x="956" y="337" class="label" fill="#fff">红</text>
  <rect x="940" y="370" width="58" height="58" fill="#d92d20" class="tile"/>
  <text x="956" y="407" class="label" fill="#fff">红</text>
  <text x="600" y="480" class="small">上面：棱块侧色　下面：该面的中心块</text>

  <!-- Step 3 -->
  <rect x="1070" y="170" width="465" height="345" rx="24" class="card"/>
  <circle cx="1115" cy="217" r="24" fill="#5965e8"/>
  <text x="1107" y="225" font-family="sans-serif" font-size="23" font-weight="700" fill="white">3</text>
  <text x="1155" y="227" class="step">对应侧面转 180°</text>
  <text x="1105" y="270" class="body">红面转两下：F2（可能是 R2/B2/L2）。</text>

  <!-- red face before and after -->
  <g transform="translate(1120,305)">
    <rect x="0" y="0" width="52" height="52" fill="#fda29b" class="tile"/>
    <rect x="54" y="0" width="52" height="52" fill="#d92d20" class="tile"/>
    <rect x="108" y="0" width="52" height="52" fill="#fda29b" class="tile"/>
    <rect x="0" y="54" width="52" height="52" fill="#fda29b" class="tile"/>
    <rect x="54" y="54" width="52" height="52" fill="#d92d20" class="tile"/>
    <rect x="108" y="54" width="52" height="52" fill="#fda29b" class="tile"/>
    <rect x="0" y="108" width="52" height="52" fill="#fda29b" class="tile"/>
    <rect x="54" y="108" width="52" height="52" fill="#fda29b" class="tile"/>
    <rect x="108" y="108" width="52" height="52" fill="#fda29b" class="tile"/>
    <polygon points="54,0 106,0 94,-28 66,-28" fill="#fff" stroke="#172033" stroke-width="4"/>
  </g>
  <path d="M1310 385 C1350 335, 1405 335, 1440 385" class="arrow" marker-end="url(#arrowhead)"/>
  <text x="1365" y="331" class="label" fill="#5965e8">F2</text>
  <text x="1134" y="493" class="small">棱块从顶层 → 底层正确槽位</text>

  <!-- Final check -->
  <rect x="60" y="555" width="1475" height="375" rx="24" class="card"/>
  <text x="100" y="612" class="step">完成后这样检查：白色十字 + 四个侧面都对色</text>

  <!-- bottom white cross -->
  <g transform="translate(150,655)">
    <rect x="0" y="0" width="72" height="72" fill="#cfd6e3" class="tile"/>
    <rect x="76" y="0" width="72" height="72" fill="#fff" class="tile"/>
    <rect x="152" y="0" width="72" height="72" fill="#cfd6e3" class="tile"/>
    <rect x="0" y="76" width="72" height="72" fill="#fff" class="tile"/>
    <rect x="76" y="76" width="72" height="72" fill="#fff" class="tile"/>
    <rect x="152" y="76" width="72" height="72" fill="#fff" class="tile"/>
    <rect x="0" y="152" width="72" height="72" fill="#cfd6e3" class="tile"/>
    <rect x="76" y="152" width="72" height="72" fill="#fff" class="tile"/>
    <rect x="152" y="152" width="72" height="72" fill="#cfd6e3" class="tile"/>
  </g>
  <text x="165" y="910" class="label">底面：白色“＋”</text>

  <!-- matching side centers -->
  <g transform="translate(520,680)">
    <text x="0" y="-28" class="body">侧面检查（下排棱块必须与中心同色）</text>
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="112" height="82" fill="#d92d20" class="tile"/>
      <rect x="0" y="86" width="112" height="82" fill="#d92d20" class="tile"/>
      <text x="32" y="52" class="label" fill="#fff">红</text><text x="32" y="138" class="label" fill="#fff">红</text>
    </g>
    <g transform="translate(142,0)">
      <rect x="0" y="0" width="112" height="82" fill="#1570ef" class="tile"/>
      <rect x="0" y="86" width="112" height="82" fill="#1570ef" class="tile"/>
      <text x="32" y="52" class="label" fill="#fff">蓝</text><text x="32" y="138" class="label" fill="#fff">蓝</text>
    </g>
    <g transform="translate(284,0)">
      <rect x="0" y="0" width="112" height="82" fill="#12b76a" class="tile"/>
      <rect x="0" y="86" width="112" height="82" fill="#12b76a" class="tile"/>
      <text x="32" y="52" class="label" fill="#fff">绿</text><text x="32" y="138" class="label" fill="#fff">绿</text>
    </g>
    <g transform="translate(426,0)">
      <rect x="0" y="0" width="112" height="82" fill="#f79009" class="tile"/>
      <rect x="0" y="86" width="112" height="82" fill="#f79009" class="tile"/>
      <text x="32" y="52" class="label">橙</text><text x="32" y="138" class="label">橙</text>
    </g>
    <text x="572" y="51" class="label" fill="#12b76a">✓ 正确</text>
    <text x="572" y="137" class="small">四组都匹配，才是完整十字</text>
  </g>

  <rect x="1120" y="653" width="350" height="224" rx="18" fill="#eef0ff"/>
  <text x="1150" y="704" class="step">口令</text>
  <text x="1150" y="756" class="title" font-size="38">找白棱</text>
  <text x="1150" y="804" class="title" font-size="38">侧色对中心</text>
  <text x="1150" y="852" class="title" font-size="38">该面转两下</text>
</svg>
